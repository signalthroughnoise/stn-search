<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STN Search Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="description" content="Signal Through Noise search suite: music, stock footage and template search in one place.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#18151c; --panel:#221d28; --panel2:#2b2531; --border:#40384a;
    --text:#f4eee6; --dim:#ad9fb5; --accent:#e8935a; --accent2:#7bacdd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Nunito', Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text);
    padding:32px 24px 60px;
  }
  .wrap{max-width:980px; margin:0 auto;}
  .brandRow{display:flex; align-items:center; gap:14px; margin-bottom:4px;}
  .brandRow img{height:34px; width:34px; border-radius:8px; flex-shrink:0;}
  .brandRow .dash{color:var(--dim); font-size:20px; font-weight:400;}
  h1{font-size:23px; margin:0; font-weight:800;}
  .subtitle{color:var(--dim); font-size:14px; margin:0 0 22px;}

  /* Tabs */
  .tabs{display:flex; gap:8px; margin:18px 0 22px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:12px;}
  .tab{
    background:transparent; border:1px solid var(--border); color:var(--dim);
    border-radius:12px; padding:9px 16px; font-family:inherit; font-size:14px; font-weight:700;
    cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; gap:1px; line-height:1.2;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab small{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; opacity:.8;}
  .tab:hover{color:var(--text); border-color:var(--dim);}
  .tab[aria-selected="true"]{background:var(--panel2); color:var(--text); border-color:var(--accent);}
  .tool[hidden]{display:none;}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:24px; margin-bottom:20px; box-shadow:0 3px 16px rgba(0,0,0,.22);
  }
  label{display:block; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; font-weight:700;}
  select, textarea, input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit;
  }
  textarea{min-height:64px; resize:vertical;}
  .row{display:flex; gap:16px; flex-wrap:wrap;}
  .row > div{flex:1; min-width:240px;}
  .tags{margin-top:10px; font-size:12.5px; color:var(--dim); line-height:1.5;}
  .tags b{color:var(--text);}
  .divider{
    display:flex; align-items:center; gap:12px; color:var(--dim); font-size:12px;
    margin:18px 0; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
  }
  .divider::before, .divider::after{content:""; flex:1; height:1px; background:var(--border);}
  .platforms{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:14px;}
  .card{
    background:var(--panel2); border:1px solid var(--border); border-radius:14px;
    padding:18px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 10px rgba(0,0,0,.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.28);}
  .card h3{margin:0; font-size:15px; font-weight:700;}
  .card p{margin:0; font-size:12.5px; color:var(--dim); line-height:1.5; flex:1;}
  .card a{
    display:inline-block; text-align:center; background:var(--accent); color:#fff;
    text-decoration:none; padding:10px 14px; border-radius:10px; font-size:13.5px; font-weight:700;
    transition:opacity .15s ease, transform .15s ease;
  }
  .card a:hover{opacity:.9; transform:translateY(-1px);}
  .card a.secondary{background:transparent; color:var(--accent2); border:1px solid var(--accent2);}
  a.disabled{opacity:.4; pointer-events:none;}
  .note{
    font-size:12px; color:var(--dim); background:var(--panel2); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; margin-top:6px;
  }
  .footer{font-size:11.5px; color:var(--dim); margin-top:28px; text-align:center;}
  .badge{
    display:inline-block; font-size:10.5px; padding:2px 9px; border-radius:20px;
    background:rgba(123,172,221,.16); color:var(--accent2); margin-left:6px; vertical-align:middle;
  }
  .badge.commercial{background:rgba(232,147,90,.18); color:var(--accent);}
  .searchAllRow{display:flex; justify-content:flex-end; margin-bottom:14px;}
  .searchAllBtn, .accent2Btn{
    background:var(--accent2); color:#fff; border:none; border-radius:10px;
    padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
    text-decoration:none; display:inline-block;
    transition:opacity .15s ease, transform .15s ease;
  }
  .searchAllBtn:hover, .accent2Btn:hover{opacity:.9; transform:translateY(-1px);}
  .searchAllBtn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
  .popupHint{font-size:12.5px; color:var(--dim); text-align:right; margin:6px 2px 14px;}
  .popupBlockedMsg{
    font-size:12.5px; color:#fff; background:rgba(232,147,90,.25); border:1px solid var(--accent);
    border-radius:10px; padding:8px 12px; text-align:right; margin:6px 2px 0; display:none;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    background:var(--panel2); border:1px solid var(--border); color:var(--dim);
    border-radius:20px; padding:7px 15px; font-size:12.5px; cursor:pointer; user-select:none;
    font-family:inherit; transition:background .15s ease, transform .1s ease;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip.active{background:var(--accent2); border-color:var(--accent2); color:#fff;}
  .finalQuery{font-size:12.5px; color:var(--dim); margin-top:10px; line-height:1.5;}
  .finalQuery b{color:var(--text); font-weight:normal;}
  .syncNote{font-size:11.5px; color:var(--dim); margin-top:6px;}
  body.in-premiere .popupHint, body.in-premiere .popupBlockedMsg{display:none !important;}
  @media (max-width:600px){
    body{padding:20px 16px 48px;}
    .row > div{min-width:0; flex:1 1 100% !important;}
  }
</style>
</head>

    <h1>Search Suite</h1>
  </div>
  <p class="subtitle">Music, stock footage and templates in one place. Pick a mood or type your own prompt, then click straight through to a pre-filled search on each platform.</p>

  <div class="tabs" role="tablist" id="tabs"></div>

<script>
/* ===========================================================================
   STN Search Suite — Cue Sheet (music) + Second Unit (stock footage) +
   Take One (templates), merged into one page.

   Everything here builds deep links into each platform's own search. Nothing
   is scraped, no API keys, no backend. The platform-specific tuning below
   (single keywords, tag facets, duration filters, etc.) is carried over
   exactly from the three original tools, including their live-test notes.
   ========================================================================= */

/* ---------- Runtime: browser vs. Premiere (CEP panel) ---------------------
   In a CEP panel, window.open / target links don't reliably reach the user's
   real browser, so every outbound link goes through openExternal(), which
   uses CEP's openURLInDefaultBrowser when it's available. In a normal
   browser it uses window.open with a stable per-platform tab name so repeat
   searches reuse the same tab (see tabName notes below). */
const IN_PREMIERE = !!(window.__adobe_cep__ && window.cep && window.cep.util && window.cep.util.openURLInDefaultBrowser);
if(IN_PREMIERE) document.body.classList.add('in-premiere');

function openExternal(url, name){
  if(IN_PREMIERE){ window.cep.util.openURLInDefaultBrowser(url); return true; }
  return window.open(url, name);
}

if(IN_PREMIERE){
  document.addEventListener('click', ev => {
    const a = ev.target.closest('a[href]');
    if(!a) return;
    const href = a.getAttribute('href');
    if(!href || href === '#') return;
    ev.preventDefault();
    openExternal(href);
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Text helpers ----------------------------------------------------
   The original tools used slightly different stopword lists and word
   splitting (music only splits on "-", footage/templates split on "-" and
   "/" and also drop "at"/"by"). Kept separate so every generated URL is
   identical to the originals. */
const BASE_STOPWORDS = ["a","an","and","the","or","with","of","to","in","on","not","but","yet","for","is","as"];

function makeText(stopList, splitRe){
  const SW = new Set(stopList);
  const keep = w => w && !SW.has(w.toLowerCase());
  const clean = s => s.trim().replace(splitRe, " ");
  const meaningfulWords = q => clean(q.split(",")[0]).split(/\s+/).filter(keep);
  return {
    meaningfulWords,
    singleKeyword: q => meaningfulWords(q)[0] || "",
    allMeaningfulWords: q => q.split(",").flatMap(chunk => clean(chunk).split(/\s+/).filter(keep)),
    moodPhrase: q => q.split(",").map(chunk => clean(chunk).split(/\s+/).filter(keep).join(" ")).filter(Boolean).join(", "),
    firstWordOf: t => clean(t).split(/\s+/).filter(keep)[0] || ""
  };
}

const musicText = makeText(BASE_STOPWORDS, /-/g);
const footageText = makeText([...BASE_STOPWORDS, "at", "by"], /[-/]/g);
const templateText = makeText([...BASE_STOPWORDS, "at", "by"], /[-/]/g);

/* ---------- Reference-track parsing (music) -------------------------------- */
function youtubeRefResult(id){
  return {
    platform:"YouTube", id,
    primaryLabel:"Open Similar Tracks (Mix) →",
    // Confirmed live: list=RD{videoId}&start_radio=1 loads YouTube's own
    // auto-generated "Mix" for that track and starts playing immediately.
    primaryUrl:`https://www.youtube.com/watch?v=${id}&list=RD${id}&start_radio=1`,
    instructions:`Opens straight into YouTube's auto-generated "Mix" for this track — a similar-songs playlist that starts playing immediately.`
  };
}

function parseReferenceUrl(raw){
  let u;
  try{ u = new URL(raw.trim()); } catch(e){ return null; }
  const host = u.hostname.replace(/^www\./, "");
  if(host === "open.spotify.com"){
    const m = u.pathname.match(/\/track\/([A-Za-z0-9]+)/);
    if(!m) return null;
    return {
      platform:"Spotify", id:m[1],
      primaryLabel:"Open Track on Spotify →",
      primaryUrl:`https://open.spotify.com/track/${m[1]}`,
      instructions:`Spotify doesn't expose a link straight to "song radio" — once the track opens, click the "•••" menu → "Go to song radio" for a real 50-track playlist of similar songs.`
    };
  }
  if(host === "youtu.be"){
    const id = u.pathname.slice(1).split("/")[0];
    return id ? youtubeRefResult(id) : null;
  }
  if(host === "youtube.com" || host === "music.youtube.com"){
    let id = u.searchParams.get("v");
    if(!id){
      const m = u.pathname.match(/\/(shorts|embed)\/([A-Za-z0-9_-]{6,})/);
      if(m) id = m[2];
    }
    return id ? youtubeRefResult(id) : null;
  }
  return null;
}

     build:q => `https://www.istockphoto.com/search/2/film?phrase=${encodeURIComponent(q)}`,
     note:"Same Getty Images family/engine, generally lower-cost tier. Also handles full descriptive prompts well."},
    {name:"Storyblocks",
     // Storyblocks and Pond5 do exact-phrase/AND-style matching — confirmed
     // live: Pond5 0 results for a full sentence vs 3,496 for "unsettling";
     // Storyblocks 12 vs 255 for the same pair.
     build:q => `https://www.storyblocks.com/video/search/${encodeURIComponent(footageText.singleKeyword(q))}`,
     note:"Their search treats the whole query as one exact phrase, so multi-word prompts return almost nothing — confirmed live (12 results for a full sentence vs. 255 for one keyword). This link uses a single keyword instead; narrow further with their on-site filters once you're there."},
    {name:"Pond5",
     build:q => `https://www.pond5.com/search?kw=${encodeURIComponent(footageText.singleKeyword(q))}&media=footage`,
     note:"Same issue as Storyblocks, more extreme — confirmed live a full descriptive sentence returned zero results, while a single keyword returned 3,496. This link uses a single keyword; use the sidebar filters on-site to layer mood/color/pace back in."},
    {name:"Artgrid",
     build:q => `https://artgrid.io/?${artgridQuery(q)}&sortId=1`,
     note:"Confirmed live: Artgrid's own search box submits one repeated URL parameter per word rather than a single string, and it handles multi-word prompts well in that format — this link replicates that exactly. Subscription-only catalog (“Get Unlimited Stock Footage”), so you'll need to be signed in to see full results."},
    {name:"Filmsupply",
     build:q => `https://www.filmsupply.com/clips?editorial=0&page=1&search=${encodeURIComponent(q)}`,
     note:"Premium cinematic footage, sister site to Musicbed. Handles full descriptive prompts well — confirmed live returning thousands of genuinely on-mood, high-end results. Also has its own Mood/Theme filter sidebar once you're there."},
    {name:"Frameset",
     build:q => `https://frameset.app/search?search=${encodeURIComponent(q)}`,
     note:"Different animal from the rest of this list — not a licensable stock library, it's a visual-reference search engine over real commercials, music videos, and films (\"Search commercials, music videos, short films, and more\"). Great for pulling a shot-reference/mood board before you brief an editor or DP, but anything you like still needs to be sourced/licensed separately — you're not getting a clean master here. Handles full descriptive prompts well — confirmed live with the picnic-in-the-park prompt returning genuinely on-mood golden-hour family shots. Heads up: the free tier caps you at a small number of searches (10 to start) before it asks you to log in or upgrade, so it's not built for repeated \"Search All\" runs the way the others are."}
  ],
  ref:{
    label:"Or start from a reference clip you already like",
    placeholder:"e.g. a link to a shot/clip you like — Vimeo, YouTube, a stock footage page, etc.",
    findSimilar:false,
    claudeLinks:[{label:"Generate Search Prompt in Claude →", build:CLAUDE_PROMPTS.footage}],
    note:`This can't actually open/analyze the link itself — that needs a live model, not client-side code in this page. Clicking through opens Claude Desktop with a research request pre-filled (look at the reference, work out its shot type/style/lighting/mood, write a stock-footage search prompt). Review it, hit send, and paste what comes back into the prompt box above.<br><br>
      Have an actual video file instead of a link? Skip this field — upload the file directly in your chat with Claude. Claude can pull frames from it with ffmpeg, look at the visual style directly (composition, lighting, color, camera movement), and hand you a ready-made Core/Tags prompt to paste into the box above. That's a stronger signal than a link, since Claude is looking at the actual footage rather than researching it secondhand.`
  },
  footer:`Generated from your "Music by Emotion" library's taxonomy, adapted for footage. Links open each platform's own search — nothing is scraped or auto-purchased.`
};

/* ---------- Tool: Take One (templates) ------------------------------------- */
// Motion Array's own search box splits a comma-separated query into tag chips
// and ANDs them together — confirmed live: 2 tags returned 16 pages, 3 tags 9
// pages, 6 tags returned nothing. A long sentence with no commas returns zero.
// Capping at 3 tags is the sweet spot.
function motionArrayKeywords(q){
  const chunks = q.split(",").map(c => c.trim()).filter(Boolean);
  const words = chunks.length > 1 ? chunks.map(templateText.firstWordOf) : templateText.meaningfulWords(q);
  return [...new Set(words.filter(Boolean))].slice(0, 3).join(", ");
}

// Motion Array's per-application template pages, confirmed live (each supports
// its own ?q= search). No Apple Motion page exists there.
const motionArrayAppSlug = {
  "After Effects":"after-effects-templates",
  "Premiere Pro":"premiere-pro-templates",
  "Final Cut Pro":"final-cut-pro-templates",
  "DaVinci Resolve":"davinci-resolve-templates"
};

const TEMPLATES = {
  id:"templates", name:"Take One", kind:"Templates",
  tabPrefix:"templatetools_",
  emotionKey:null,
  subtitle:"Type a prompt (or hand Claude a reference video/link to analyze first), narrow by template type / editing app, then click straight through to a pre-filled search on each marketplace.",
  placeholder:"e.g. epic cinematic trailer titles, bold dramatic dark heroic energy",
  promptLabel:"Search prompt",
  chipGroups:[
    // Real values confirmed live on Envato's Video Templates filters.
    {key:"categories", label:"Template type (optional — leave blank for the widest results)",
     options:["Broadcast Packages","Elements","Infographics","Logo Stings","LUT Packs","Openers","Product Promo","Titles","Video Displays"]},
    {key:"apps", label:"Editing app (optional — leave blank for the widest results)",
     options:["After Effects","Premiere Pro","Apple Motion","Final Cut Pro","DaVinci Resolve"]}
  ],
  buildFinalQuery:(base) => base,
  preview(q, chips){
    if(!q) return "";
    const parts = [q];
    if(chips.categories.size) parts.push(`categories: ${[...chips.categories].join(", ")}`);
    if(chips.apps.size) parts.push(`apps: ${[...chips.apps].join(", ")}`);
    return `Sending: <b>${esc(parts.join(" | "))}</b>`;
  },
  platforms:[
    {name:"Envato Elements",
     build:(q, ctx) => {
       let url = `https://app.envato.com/search?itemType=video-templates&term=${encodeURIComponent(q)}`;
       ctx.categories.forEach(c => url += `&filter.categories=${encodeURIComponent(c)}`);
       ctx.apps.forEach(a => url += `&filter.applications_supported=${encodeURIComponent(a)}`);
       return url;
     },
     note:"Confirmed live: handles full descriptive prompts well (commas and all), no single-keyword workaround needed like Motion Array/Storyblocks — a 6-word mood prompt returned genuinely on-mood, well-matched title templates. Template type and editing app narrow the results as real filters, not free text. Once there, the Styles/Theme/Events filters can layer on more."},
    {name:"Motion Array",
     build:(q, ctx) => {
       const kw = motionArrayKeywords(q);
       const matchedApps = ctx.apps.filter(a => motionArrayAppSlug[a]);
       if(matchedApps.length === 1){
         return `https://motionarray.com/${motionArrayAppSlug[matchedApps[0]]}/?q=${encodeURIComponent(kw)}`;
       }
       return `https://motionarray.com/browse/search/${encodeURIComponent(kw)}/?category=templates`;
     },
     note:"Full descriptive sentences return zero here (exact-phrase match fails), but — like Audiomachine's Genre/Keyword tags — Motion Array's own search box splits a comma-separated query into individual tag chips and ANDs them together. This link takes up to 3 short keywords from your prompt and stacks them the same way, confirmed live to return genuinely on-mood results (well beyond just one bare word) without over-narrowing to zero. Picking exactly one editing app (After Effects, Premiere Pro, Final Cut Pro, or DaVinci Resolve — confirmed live) switches to that app's own template listing; picking none or more than one falls back to Motion Array's combined cross-software search. Template type chips above are Envato's own category list and don't carry over here — Motion Array's category filter didn't expose a clean shareable URL when tested live, so it's left for on-site narrowing once you're there."}
  ],
  ref:{
    label:"Or start from a template/asset link you already like",
    placeholder:"e.g. a link to an Envato item, or any other reference clip/template",
    findSimilar:false,
    claudeLinks:[{label:"Generate Search Prompt in Claude →", build:CLAUDE_PROMPTS.template}],
    note:`This can't actually open/analyze the link itself — that needs a live model, not client-side code in this page. Clicking through opens Claude Desktop with a research request pre-filled (look at the reference, work out its style/category/mood, write an Envato-style search prompt). Review it, hit send, and paste what comes back into the prompt box above.<br><br>
      Have an actual video file instead of a link? Skip this field — upload the file directly in your chat with Claude. Claude can pull frames from it with ffmpeg, look at the visual style directly, and hand you a ready-made Core/Tags prompt to paste into the box above. That's a stronger signal than a link, since Claude is looking at the actual footage rather than researching it secondhand.`
  },
  footer:`Links open each marketplace's own search — nothing is scraped or auto-purchased. More marketplaces (MotionElements, etc.) can be added the same way.`
};

const TOOLS = [MUSIC, STOCK, TEMPLATES];

/* ---------- tabName --------------------------------------------------------
   A stable per-platform window name (instead of "_blank") means a repeat
   search navigates the SAME already-open tab for that platform rather than
   piling up a new one. Deliberately NOT using rel="noopener" — noopener puts
   the new tab in an unrelated browsing-context group, which breaks the
   name-matching (confirmed live: with noopener every click opened a new tab). */
const tabName = (tool, name) => tool.tabPrefix + name.replace(/[^a-zA-Z0-9]/g, "_");

/* ---------- Build each tool's UI ------------------------------------------- */
const tabsEl = document.getElementById('tabs');
const toolsEl = document.getElementById('tools');

function buildTool(tool){
  const id = s => `${tool.id}-${s}`;
  const section = document.createElement('section');
  section.className = 'tool';
  section.id = id('panel');
  section.setAttribute('role', 'tabpanel');

  const emotionBlock = tool.emotionKey ? `
    <div class="row">
      <div>
        <label for="${id('emotion')}">Your emotion library</label>
        <select id="${id('emotion')}"><option value="">— Custom prompt only —</option>
          ${EMOTIONS.map((e, i) => `<option value="${i}">${esc(e.main)} — ${esc(e.sub)}</option>`).join("")}
        </select>
      </div>
      <div>
        <label for="${id('variant')}">Prompt style</label>
        <select id="${id('variant')}">
          ${tool.variantOptions.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}
        </select>
      </div>
    </div>` : "";

  const chipBlocks = tool.chipGroups.map((g, gi) => `
    <div style="margin-top:${gi === 0 ? 18 : 14}px;">
      <label>${esc(g.label)}</label>
      <div class="chips" data-group="${g.key}">
        ${g.options.map(o => `<button type="button" class="chip" data-value="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join("")}
      </div>
    </div>`).join("");

  const r = tool.ref;
  const primaryAction = r.findSimilar
    ? `<button id="${id('refBtn')}" type="button" class="accent2Btn">Find Similar Tracks &rarr;</button>`
    : `<a id="${id('claude0')}" href="#" class="accent2Btn disabled">${esc(r.claudeLinks[0].label)}</a>`;
  const secondaryLinks = r.findSimilar
    ? `<div class="row" style="margin-top:10px; gap:10px;">
        ${r.claudeLinks.map((c, i) => `<a id="${id('claude' + i)}" href="#" class="accent2Btn disabled">${esc(c.label)}</a>`).join("")}
      </div>` : "";

  section.innerHTML = `
    <p class="subtitle">${esc(tool.subtitle)}</p>
    <div class="panel">
      ${emotionBlock}
      <div style="margin-top:${tool.emotionKey ? 16 : 0}px;">
        <label for="${id('prompt')}">${esc(tool.promptLabel)}</label>
        <textarea id="${id('prompt')}" placeholder="${esc(tool.placeholder)}"></textarea>
      </div>
      <div class="tags" id="${id('refInfo')}"></div>
      ${chipBlocks}
      <div class="finalQuery" id="${id('preview')}"></div>
    </div>
    ${tool.afterInputsNote ? `<div class="note" style="margin:-6px 0 20px;">${tool.afterInputsNote}</div>` : ""}
    <div class="panel">
      <label for="${id('refUrl')}">${esc(r.label)}</label>
      <div class="row" style="align-items:flex-end;">
        <div style="flex:3;"><input type="text" id="${id('refUrl')}" placeholder="${esc(r.placeholder)}"></div>
        <div style="flex:0 0 auto; min-width:0;">${primaryAction}</div>
      </div>
      ${r.findSimilar ? `<div id="${id('refResult')}" class="tags"></div>` : ""}
      ${secondaryLinks}
      <div class="note" style="margin-top:14px;">${r.note}</div>
    </div>

    <div class="divider">Search this prompt on</div>
    <div class="searchAllRow"><button id="${id('searchAll')}" type="button" class="searchAllBtn">Search All &rarr;</button></div>
    <div class="popupHint">Browsers typically only allow the first tab to open on the first click. If that happens: click the blocked-pop-ups icon in your address bar → "Always allow pop-ups from this site" → click Search All again.</div>
    <div class="popupBlockedMsg" id="${id('blocked')}"></div>
    <div class="platforms" id="${id('cards')}"></div>
    ${tool.bottomNote ? `<div class="note" style="margin-top:20px;">${tool.bottomNote}</div>` : ""}
    <div class="footer">${esc(tool.footer)}</div>
  `;
  toolsEl.appendChild(section);

  const $ = s => document.getElementById(id(s));
  const el = {
    emotion:$('emotion'), variant:$('variant'), prompt:$('prompt'), refInfo:$('refInfo'),
    preview:$('preview'), refUrl:$('refUrl'), refBtn:$('refBtn'), refResult:$('refResult'),
    searchAll:$('searchAll'), blocked:$('blocked'), cards:$('cards'),
    claude:r.claudeLinks.map((_, i) => $('claude' + i))
  };
  const chips = {};
  tool.chipGroups.forEach(g => chips[g.key] = new Set());

  const state = {tool, el, chips};

  function currentEmotion(){
    if(!tool.emotionKey) return null;
    const v = el.emotion.value;
    return v === "" ? null : EMOTIONS[parseInt(v, 10)];
  }

  // Audiomachine/Megatrax use a curated keyword tied to the selected emotion.
  // If you've typed over the auto-filled prompt, that keyword goes stale, so
  // fall back to deriving it from the live prompt text like the other
  // platforms do. Confirmed live: without this, editing the prompt left those
  // two platforms searching the old emotion's word.
  function effectiveEmotion(){
    const e = currentEmotion();
    if(!e) return null;
    const p = e[tool.emotionKey];
    const val = el.prompt.value.trim();
    return (val === p.core.trim() || val === p.tags.trim()) ? p : null;
  }

  function context(){
    const ctx = {emotion:effectiveEmotion()};
    tool.chipGroups.forEach(g => ctx[g.key] = [...chips[g.key]]);
    return ctx;
  }

  function finalQuery(){ return tool.buildFinalQuery(el.prompt.value.trim(), chips); }

  function renderCards(){
    const q = finalQuery();
    const ctx = context();
    el.cards.innerHTML = "";
    tool.platforms.forEach(p => {
      const url = q ? p.build(q, ctx) : null;
      const url2 = (q && p.build2) ? p.build2(q, ctx) : null;
      const badge = !tool.badges ? "" : (p.category === "commercial"
        ? `<span class="badge commercial">Popular / needs licensing</span>`
        : `<span class="badge">Stock library</span>`);
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.platform = p.name;
      card.innerHTML = `
        <h3>${esc(p.name)}${badge}</h3>
        <p>${p.note}</p>
        <a class="primary${url ? '' : ' disabled'}" href="${url ? esc(url) : '#'}" target="${tabName(tool, p.name)}">Search on ${esc(p.name)} &rarr;</a>
        ${p.build2 ? `<a class="secondary${url2 ? '' : ' disabled'}" href="${url2 ? esc(url2) : '#'}" target="${tabName(tool, p.name + '_alt')}">${esc(p.label2)}</a>` : ''}
      `;
      el.cards.appendChild(card);
    });
    el.searchAll.disabled = !q;
    el.blocked.style.display = "none";
    el.preview.innerHTML = tool.preview(q, chips);
  }

  function fillPromptFromSelection(){
    const e = currentEmotion();
    if(!e){ el.refInfo.innerHTML = ""; renderCards(); return; }
    const p = e[tool.emotionKey];
    el.prompt.value = el.variant.value === "tags" ? p.tags : p.core;
    el.refInfo.innerHTML = `<b>${esc(e.main)} → ${esc(e.sub)}</b><br>Core: ${esc(p.core)}<br>Tags: ${esc(p.tags)}`;
    renderCards();
  }

  // True when the prompt box is empty or still holds an auto-filled emotion
  // prompt (i.e. the user hasn't typed their own) — safe to overwrite.
  function promptUntouched(){
    const val = el.prompt.value.trim();
    if(!val) return true;
    return EMOTIONS.some(e => { const p = e[tool.emotionKey]; return val === p.core.trim() || val === p.tags.trim(); });
  }

  function searchAll(){
    const q = finalQuery();
    if(!q) return;
    const ctx = context();
    let opened = 0, blocked = 0;
    const list = tool.platforms;
    list.forEach((p, i) => {
      // Slight stagger: browsers are more willing to honor a run of
      // window.open calls spread across a few ticks than a tight loop.
      setTimeout(() => {
        const win = openExternal(p.build(q, ctx), tabName(tool, p.name));
        if(win){ opened++; } else { blocked++; }
        if(i === list.length - 1){
          setTimeout(() => {
            if(blocked > 0){
              el.blocked.textContent = `Only ${opened} of ${list.length} tabs opened — ${blocked} blocked by your browser. Click the blocked-pop-ups icon in the address bar → "Always allow pop-ups from this site", then click Search All again.`;
              el.blocked.style.display = "block";
            } else {
              el.blocked.style.display = "none";
            }
          }, 200);
        }
      }, i * 120);
    });
  }

  function updateClaudeLinks(){
    const raw = el.refUrl.value.trim();
    r.claudeLinks.forEach((c, i) => {
      const a = el.claude[i];
      a.href = raw ? claudeLink(c.build(raw)) : "#";
      a.classList.toggle('disabled', !raw);
    });
  }

  function renderRefResult(){
    const raw = el.refUrl.value.trim();
    updateClaudeLinks();
    if(!raw){ el.refResult.innerHTML = ""; return; }
    const result = parseReferenceUrl(raw);
    if(!result){
      el.refResult.innerHTML = `<span style="color:var(--accent);">Couldn't recognize that link — paste a Spotify track URL (open.spotify.com/track/...) or a YouTube video URL (youtube.com/watch?v=... or youtu.be/...).</span>`;
      return;
    }
    el.refResult.innerHTML = `
      <b>${result.platform} track detected.</b><br>
      ${esc(result.instructions)}<br>
      <a href="${esc(result.primaryUrl)}" target="_blank" rel="noopener"
         style="display:inline-block; margin-top:8px; background:var(--accent2); color:#fff; text-decoration:none; padding:8px 14px; border-radius:6px; font-size:13px; font-weight:bold;">
        ${esc(result.primaryLabel)}
      </a>`;
  }

  // Wire up
  section.querySelectorAll('.chips').forEach(group => {
    const set = chips[group.dataset.group];
    group.addEventListener('click', ev => {
      const chip = ev.target.closest('.chip');
      if(!chip) return;
      const v = chip.dataset.value;
      if(set.has(v)){ set.delete(v); } else { set.add(v); }
      chip.classList.toggle('active', set.has(v));
      chip.setAttribute('aria-pressed', set.has(v));
      renderCards();
    });
  });
  if(tool.emotionKey){
    el.emotion.addEventListener('change', () => { fillPromptFromSelection(); syncEmotion(tool, el.emotion.value); });
    el.variant.addEventListener('change', fillPromptFromSelection);
  }
  el.prompt.addEventListener('input', renderCards);
  el.searchAll.addEventListener('click', searchAll);
  el.refUrl.addEventListener('input', updateClaudeLinks);
  if(r.findSimilar){
    el.refBtn.addEventListener('click', renderRefResult);
    el.refUrl.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); renderRefResult(); } });
  } else {
    el.refUrl.addEventListener('keydown', ev => { if(ev.key === 'Enter') ev.preventDefault(); });
  }

  // Tab button
  const tab = document.createElement('button');
  tab.type = 'button';
  tab.className = 'tab';
  tab.id = id('tab');
  tab.setAttribute('role', 'tab');
  tab.setAttribute('aria-controls', section.id);
  tab.innerHTML = `${esc(tool.name)}<small>${esc(tool.kind)}</small>`;
  tab.addEventListener('click', () => showTool(tool.id));
  tabsEl.appendChild(tab);

  Object.assign(state, {section, tab, renderCards, fillPromptFromSelection, promptUntouched});
  renderCards();
  return state;
}

const STATES = {};
TOOLS.forEach(t => STATES[t.id] = buildTool(t));

/* ---------- Shared emotion between Music and Stock --------------------------
   Picking an emotion on one tab carries it to the other, as long as the other
   tab's prompt is empty or still auto-filled (never overwrites your own text). */
function syncEmotion(fromTool, value){
  if(value === "") return;
  TOOLS.filter(t => t.emotionKey && t !== fromTool).forEach(t => {
    const s = STATES[t.id];
    if(s.el.emotion.value === value || !s.promptUntouched()) return;
    s.el.emotion.value = value;
    s.fillPromptFromSelection();
  });
}

/* ---------- Tab switching (remembers last tab; supports #music etc.) ------- */
function showTool(toolId, fromHash){
  if(!STATES[toolId]) toolId = TOOLS[0].id;
  TOOLS.forEach(t => {
    const s = STATES[t.id];
    const on = t.id === toolId;
    s.section.hidden = !on;
    s.tab.setAttribute('aria-selected', on);
    s.tab.tabIndex = on ? 0 : -1;
  });
  const t = TOOLS.find(t => t.id === toolId);
  document.title = `${t.name} — STN Search Suite`;
  try{ localStorage.setItem('stn-suite-tab', toolId); } catch(e){}
  if(!fromHash && location.hash.slice(1) !== toolId){
    try{ history.replaceState(null, "", "#" + toolId); } catch(e){}
  }
}

tabsEl.addEventListener('keydown', ev => {
  if(ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
  const ids = TOOLS.map(t => t.id);
  const cur = ids.findIndex(i => STATES[i].tab.getAttribute('aria-selected') === 'true');
  const next = ids[(cur + (ev.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length];
  showTool(next);
  STATES[next].tab.focus();
});

window.addEventListener('hashchange', () => showTool(location.hash.slice(1), true));

(function initTab(){
  let start = location.hash.slice(1);
  if(!STATES[start]){
    try{ start = localStorage.getItem('stn-suite-tab') || ""; } catch(e){ start = ""; }
  }
  showTool(STATES[start] ? start : TOOLS[0].id);
})();

/* ---------- Installable app (only when served from a real web address) -----
   The service worker lets the hosted version be installed as its own app
   window and keep working offline. Skipped when opened as a local file or
   inside the Premiere panel. */
if('serviceWorker' in navigator && location.protocol.startsWith('http') && !IN_PREMIERE){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
